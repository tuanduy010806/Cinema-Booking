services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema_booking
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: 123456 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: