<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Cinema Booking — kiến trúc hệ thống</title>
  <desc id="desc">Sơ đồ kiến trúc FastAPI gồm API, bảo mật, service, repository, SQLAlchemy và PostgreSQL.</desc>
