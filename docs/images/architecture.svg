    <text x="388" y="194">Showtimes API</text><text x="388" y="209" class="small">/api/v1/showtimes</text>
    <text x="388" y="246">Movies API</text><text x="388" y="261" class="small">/api/v1/movies</text>
    <text x="388" y="291">Auth API</text><text x="388" y="306" class="small">/api/v1/auth</text>
