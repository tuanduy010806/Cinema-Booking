<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="704" viewBox="0 0 1456 704" role="img" aria-labelledby="title desc">
  <title id="title">Cinema Booking — kiến trúc hệ thống</title>
  <desc id="desc">Sơ đồ mới nhất: chọn và giữ ghế, thanh toán hold, sau đó PaymentService tạo booking. Bookings API chỉ cho xem và hủy booking.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#60798f"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#222;font-size:12px}.title{font-size:18px;font-weight:bold}.group{font-size:14px;font-weight:bold}.box{fill:#f6f6f6;stroke:#a1a1a1;stroke-width:1}.api{fill:#eaf2fb;stroke:#9bb1c8}.service{fill:#e7f3e6;stroke:#9dbb96}.security{fill:#fce8e6;stroke:#d4a09d}.data{fill:#fff3d6;stroke:#d0b776}.edge{fill:none;stroke:#60798f;stroke-width:1.2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}.note{fill:#fffde7;stroke:#b5ad73;stroke-width:1}.small{font-size:11px}.actor{font-size:12px;text-anchor:middle}
    </style>
  </defs>
  <rect width="1456" height="704" fill="#fbfbfd"/>
  <text x="760" y="22" class="title" text-anchor="middle">Cinema Booking — kiến trúc hệ thống</text>

  <!-- Notes and system boundary -->
  <path class="note" d="M214 32h344l12 12v49H214z"/>
  <text x="226" y="51" class="small"><tspan x="226">Luồng đặt vé: chọn ghế → tạo hold → thanh toán → PaymentService tạo booking.</tspan><tspan x="226" dy="15">Không còn API tạo booking trực tiếp; Bookings API chỉ cho xem và hủy.</tspan><tspan x="226" dy="15">Payment hiện chỉ mô phỏng, chưa gọi cổng thanh toán thật.</tspan></text>
  <rect x="292" y="81" width="973" height="555" rx="7" fill="none" stroke="#9aabc0" stroke-width="1.2"/>
  <text x="778" y="99" class="group" text-anchor="middle">Ứng dụng Cinema Booking · FastAPI</text>

  <!-- Layer backgrounds -->
  <rect x="312" y="151" width="151" height="384" rx="7" class="api"/>
  <text x="387" y="169" class="group" text-anchor="middle">HTTP API · /api/v1</text>
  <rect x="590" y="117" width="174" height="352" rx="7" class="service"/>
  <text x="677" y="135" class="group" text-anchor="middle">Nghiệp vụ · Services</text>
  <rect x="933" y="188" width="310" height="280" rx="7" class="data"/>
  <text x="1088" y="207" class="group" text-anchor="middle">Truy cập dữ liệu</text>
  <rect x="618" y="460" width="440" height="155" rx="7" class="security"/>
  <text x="838" y="478" class="group" text-anchor="middle">Bảo mật &amp; dữ liệu vào/ra</text>

