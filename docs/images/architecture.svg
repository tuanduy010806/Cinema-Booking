<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cinema Booking — kiến trúc hệ thống hiện tại</title>
  <desc id="desc">FastAPI middleware, routers, request dependencies, services, domain ports, SQLAlchemy repositories, Unit of Work và PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#526579"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#263442;font-size:13px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:14px;fill:#526579}.head{font-size:17px;font-weight:bold}.label{font-size:14px;font-weight:bold}.small{font-size:12px}.actor{font-size:13px;font-weight:bold;text-anchor:middle}.box{fill:#f2f4f7;stroke:#8a9bad;stroke-width:1.4}.api{fill:#eaf2fb;stroke:#9bb1c8}.security{fill:#fce8e6;stroke:#d4a09d}.service{fill:#e7f3e6;stroke:#9dbb96}.domain{fill:#eaf7f5;stroke:#94b8b1}.data{fill:#fff3d6;stroke:#d0b776}.note{fill:#fffde7;stroke:#b5ad73}.edge{fill:none;stroke:#526579;stroke-width:1.5;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1500" height="1080" fill="#fafbfd"/>
  <text x="750" y="40" class="title" text-anchor="middle">Cinema Booking — kiến trúc hệ thống hiện tại</text>
  <text x="750" y="66" class="subtitle" text-anchor="middle">Một FastAPI ứng dụng, PostgreSQL; không có frontend, cache hay worker nền</text>

  <g class="edge">
    <path d="M150 210H220"/><path d="M150 315H220"/><path d="M150 420H220"/>
    <path d="M470 345H520"/><path d="M660 615V645"/>
    <path d="M800 310H850"/><path d="M1130 340H1180"/>
    <path d="M990 650V700"/>
    <path d="M1320 750V800"/>
  </g>
  <g class="edge dash">
    <path d="M345 560V940H1170V290H1180"/>
    <path d="M1180 235H1150V160H1130"/>
    <path d="M1130 805H1210V850H1230"/>
  </g>

  <g>
    <rect class="box" x="30" y="185" width="120" height="50" rx="8"/><text class="actor" x="90" y="215">Khách</text>
    <rect class="box" x="30" y="290" width="120" height="50" rx="8"/><text class="actor" x="90" y="320">USER</text>
    <rect class="box" x="30" y="395" width="120" height="50" rx="8"/><text class="actor" x="90" y="425">ADMIN</text>

    <rect class="box security" x="220" y="145" width="250" height="415" rx="10"/>
    <text class="head" x="345" y="175" text-anchor="middle">AuthMiddleware</text>
    <text class="small" x="242" y="210">Áp dụng trước mọi route</text>
    <text class="small" x="242" y="238">• Không có token: cho request</text><text class="small" x="254" y="256">công khai đi tiếp</text>
    <text class="small" x="242" y="286">• Token được gửi: kiểm tra JWT</text>
    <text class="small" x="242" y="316">• Đọc user_id từ claim sub</text>
    <text class="small" x="242" y="346">• UserRepository.get_by_id()</text>
    <text class="small" x="242" y="366">  qua AsyncSessionLocal riêng</text>
    <text class="small" x="242" y="396">• Nạp UserEntity vào</text><text class="small" x="254" y="414">request.state.current_user</text>
    <text class="small" x="242" y="444">• Gọi tiếp router bằng call_next</text>
    <text class="small" x="242" y="490">Token không hợp lệ → HTTP 401</text>

    <rect class="box api" x="520" y="115" width="280" height="500" rx="10"/>
    <text class="head" x="660" y="145" text-anchor="middle">Routers · /api/v1</text>
    <text class="label" x="545" y="185">Auth</text><text class="small" x="545" y="206">register · login · me</text>
    <text class="label" x="545" y="246">Movies</text><text class="small" x="545" y="267">list · detail · admin CRUD</text>
    <text class="label" x="545" y="307">Showtimes</text><text class="small" x="545" y="328">list · admin create · seats</text>
    <text class="label" x="545" y="368">Seat Holds</text><text class="small" x="545" y="389">create · get · release</text>
    <text class="label" x="545" y="429">Payments</text><text class="small" x="545" y="450">pay hold · my payments</text>
    <text class="label" x="545" y="490">Bookings</text><text class="small" x="545" y="511">my bookings · cancel</text>
    <text class="small" x="545" y="559">Không có endpoint tạo booking trực tiếp</text>

    <rect class="box security" x="520" y="645" width="280" height="275" rx="10"/>
    <text class="head" x="660" y="675" text-anchor="middle">Request dependencies</text>
    <text class="label" x="545" y="715">Identity</text><text class="small" x="545" y="736">get_current_user / account</text>
    <text class="small" x="545" y="763">Đọc current_user từ request.state</text>
    <text class="label" x="545" y="803">RoleChecker</text><text class="small" x="545" y="824">Đọc UserEntity và kiểm tra ADMIN</text>
    <text class="small" x="545" y="861">Movies: POST / PUT / DELETE</text><text class="small" x="545" y="881">Showtimes: POST</text>
    <text class="small" x="545" y="898">Pydantic schemas · CinemaException handler</text>
    <text class="small" x="545" y="914">app/core/exceptions.py → HTTP status mapping</text>

    <rect class="box service" x="850" y="115" width="280" height="535" rx="10"/>
    <text class="head" x="990" y="145" text-anchor="middle">Application services</text>
    <text class="label" x="875" y="187">AuthService</text>
    <text class="label" x="875" y="237">MovieService</text>
    <text class="label" x="875" y="287">ShowtimeService</text><text class="small" x="875" y="306">tính trạng thái ghế</text>
    <text class="label" x="875" y="356">SeatHoldService</text><text class="small" x="875" y="375">tạo / giải phóng hold</text>
    <text class="label" x="875" y="425">PaymentService</text><text class="small" x="875" y="444">payment demo + tạo booking</text>
    <text class="label" x="875" y="494">BookingService</text><text class="small" x="875" y="513">xem / hủy booking</text>
    <text class="small" x="875" y="570">Các service dùng domain contracts</text>

    <rect class="box domain" x="850" y="700" width="280" height="220" rx="10"/>
    <text class="head" x="990" y="730" text-anchor="middle">Domain</text>
    <text class="small" x="875" y="770">Commands · Entities · Results</text>
    <text class="small" x="875" y="800">Repository ports · UnitOfWork port</text>
    <text class="small" x="875" y="830">Entities / errors used by services</text>
    <text class="small" x="875" y="870">ORM được chuyển thành entities</text>

    <rect class="box data" x="1180" y="115" width="280" height="635" rx="10"/>
    <text class="head" x="1320" y="145" text-anchor="middle">Composition / infrastructure</text>
    <text class="label" x="1205" y="190">app/api/providers.py</text><text class="small" x="1205" y="211">tạo service và adapters</text>
    <text class="small" x="1205" y="240">Provider cấp repositories + UoW</text>
    <text class="label" x="1205" y="290">SQLAlchemy repositories</text><text class="small" x="1205" y="311">ORM ↔ domain entities</text>
    <text class="label" x="1205" y="365">SqlAlchemyUnitOfWork</text><text class="small" x="1205" y="386">commit / rollback</text>
    <text class="label" x="1205" y="440">AsyncSession / async engine</text><text class="small" x="1205" y="461">provider session theo request</text>
    <text class="small" x="1205" y="510">Auth middleware mở session riêng</text>
    <text class="label" x="1205" y="560">Security adapters</text><text class="small" x="1205" y="581">PasswordSecurityAdapter</text><text class="small" x="1205" y="602">JwtTokenIssuer / token decoder</text>

    <rect class="box" x="1230" y="800" width="180" height="100" rx="10"/><text class="head" x="1320" y="840" text-anchor="middle">PostgreSQL</text><text class="small" x="1320" y="865" text-anchor="middle">cinema_booking</text>
    <rect class="note" x="30" y="960" width="1430" height="80" rx="8"/>
    <text class="small" x="55" y="990">create_hold, pay_for_hold và release_hold khóa hàng showtime; các thao tác cùng suất được tuần tự hóa tới commit/rollback.</text>
    <text class="small" x="55" y="1018">Thanh toán, booking, liên kết ghế và trạng thái paid của hold commit cùng transaction. Thanh toán thật chưa tích hợp.</text>
  </g>
  <text class="small" x="700" y="934" text-anchor="middle">UserRepository.get_by_id</text>
</svg>
