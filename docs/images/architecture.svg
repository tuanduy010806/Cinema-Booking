      text{font-family:Arial,sans-serif;fill:#263746}.title{font-size:24px;font-weight:bold}.group{font-size:18px;font-weight:bold}.box{fill:#fff;stroke:#8799aa;stroke-width:1.4}.label{font-size:15px;text-anchor:middle}.small{font-size:13px;fill:#506070;text-anchor:middle}.actor{font-size:15px;text-anchor:middle}.edge{fill:none;stroke:#526579;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#fafbfd"/><text x="720" y="38" class="title" text-anchor="middle">Cinema Booking — kiến trúc hệ thống</text>
